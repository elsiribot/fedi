[workspace]
members = [
    "fedimintd",
    "fedimint-cli",
    "fedi-social-common",
    "fedi-social-server",
    "fedi-social-client",
    "fedi-monitoring",
    "bridge/fedi-ffi",
    "bridge/ffi-bindgen",
    "bridge/fedi-wasm",
    "bridge/v0-rocksdb",
]
default-members = [
    "fedimintd",
    "fedimint-cli",
    "fedi-social-common",
    "fedi-social-server",
    "fedi-social-client",
    "fedi-monitoring",
    "bridge/fedi-ffi",
    "bridge/ffi-bindgen",
]
resolver = "2"

[profile.release]
# Note: we change wasm32 compilation settings in toolchains.nix via env vars
lto = "fat"
codegen-units = 1
strip = true

[workspace.metadata]
authors = ["The Fedi Developers"]
edition = "2021"
description = "Fedi"
documentation = "https://github.com/fedibtc/fedimintd-fedi"
readme = "README.md"
homepage = "https://fedi.xyz"
repository = "https://github.com/fedibtc/fedimintd-fedi"
license-file = "LICENSE"
keywords = ["bitcoin", "lightning", "chaumian", "e-cash", "federated"]

[workspace.dependencies]
threshold_crypto = { git = "https://github.com/fedimint/threshold_crypto" }

