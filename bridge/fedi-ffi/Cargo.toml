[package]
name = "fedi-ffi"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "fediffi"

[dependencies]
fedimint-core = { workspace = true }
fedimint-client = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-ln-client = { workspace = true }
fedimint-wallet-client = { workspace = true }
fedi-social-client = { path = "../../fedi-social-client" }
stability-pool-client = { path = "../../stability-pool/stability-pool-client" }
fedimint-derive-secret = { workspace = true }
fedimint-logging = { workspace = true }
fedimint-bip39 = { workspace = true }
threshold_crypto = { workspace = true }
fedimint-aead = { workspace = true }

fedimint-core-v0 = { workspace = true }
fedimint-client-v0 = { workspace = true }
fedimint-mint-client-v0 = { workspace = true }
fedimint-ln-client-v0 = { workspace = true }
fedimint-wallet-client-v0 = { workspace = true }
fedimint-derive-secret-v0 = { workspace = true }
fedimint-logging-v0 = { workspace = true }
fedimint-bip39-v0 = { workspace = true }
fedimint-aead-v0 = { workspace = true }
v0-rocksdb = { path = "../v0-rocksdb" }
v1-rocksdb = { path = "../v1-rocksdb" }

anyhow = "1"
bip39 = { version = "2.0.0", features = ["rand"] }
serde = { version = "1.0.142", features = [ "derive" ] }
serde_json = "1.0.79"
rand = "0.8"
bitcoin = "0.29.2"
lazy_static = "1.4.0"
lightning-invoice = "0.21.0"
futures = "0.3"
tracing = "0.1.26"
tracing-serde = "0.1.3"
thiserror = "1.0.37"
hex = "0.4.3"
macro_rules_attribute = "0.1.3"
ts-rs = { git = "https://github.com/maan2003/ts-rs", branch = "fix-type-struct-zero" }
async-trait = "0.1.64"
base64 = "0.20.0"
tokio = {version = "1.0", features = [ "time", "macros" ]}
url = "2.3.1"
ring = "0.16.20"
rolling-file = "0.2.0"
tracing-appender = "0.2.2"
tokio-util = { version = "0.7.9", features = [ "codec", "net" ] }

[target.'cfg(target_family = "wasm")'.dependencies]
ring = { version = "0.16.20", features = ["wasm32_unknown_unknown_js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
fedimint-rocksdb = { workspace = true }
fedimint-rocksdb-v0 = { workspace = true }
tracing-subscriber = { version = "0.3.1", features = [ "env-filter", "json" ] }
uniffi_macros = { version = "0.21.0", features = ["builtin-bindgen"] }
uniffi = { version = "0.21.0", features = ["builtin-bindgen"] }

[build-dependencies]
uniffi_build = { version = "0.21.0", features = ["builtin-bindgen"] }

[dev-dependencies]
tempfile = "3.3.0"

# FIXME: just put these above? or dev-dependencies
[target.'cfg(target_os = "macos")'.dependencies]
fedimint-logging = { workspace = true }
devimint = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fedimint-logging = { workspace = true }
devimint = { workspace = true }
