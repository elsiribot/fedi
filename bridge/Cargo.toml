[workspace]
members = ["calculator-ffi", "ffi-bindgen"]
default-members = ["calculator-ffi", "ffi-bindgen"]
exclude = ["calculator-android", "calculator-swift", "example-apps"]

[profile.release-smaller]
inherits = "release"
opt-level = 'z'     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary*

[patch.crates-io]
secp256k1-zkp = { git = "https://github.com/dpc/rust-secp256k1-zkp/", branch = "sanket-pr" }
rocksdb = { git = "https://github.com/justinmoon/rust-rocksdb", rev = "bcefc573d1c3fad3a1ceceb110e7d6aca2a5d0b4" }