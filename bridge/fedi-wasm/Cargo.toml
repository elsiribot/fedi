[package]
name = "fedi-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.69"
async-trait = "0.1.64"
console_error_panic_hook = "0.1.7"
fedi-ffi = { version = "0.1.2", path = "../fedi-ffi" }
futures = "0.3.26"
js-sys = "0.3.61"
rexie = "0.4.2"
ring = { version = "0.16.20", features = ["wasm32_unknown_unknown_js"] }
tracing = "0.1.37"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.34"
wasm-bindgen-test = "0.3.34"

[patch.crates-io]
secp256k1-zkp = { git = "https://github.com/dpc/rust-secp256k1-zkp/", branch = "sanket-pr" }
ring = { git = "https://github.com/Maan2003/ring" }
