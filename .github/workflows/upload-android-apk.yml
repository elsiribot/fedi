name: Upload APK to GitHub
on:
    workflow_dispatch:
    push:
        branches:
            - 'release/**.**'
            - '!release/**.**.**'
        paths:
            - 'bridge/**'
            - 'ui/native/**'
            - 'ui/common/**'
            - '!ui/native/ios/**' # Don't run for changes in /ios folder

jobs:
    release-android:
        name: Build Android APK and publish in GitHub draft release
        runs-on: [self-hosted, linux]
        outputs:
            commit-to-deploy: ${{ steps.versioning.outputs.COMMIT_TO_DEPLOY }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
              with:
                  submodules: true

            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Build bridge
              run: nix develop -c env BUILD_ALL_BRIDGE_TARGETS=1 CARGO_PROFILE=release scripts/ci/run-in-fs-dir-cache.sh build-bridge-android ./scripts/bridge/build-bridge-android.sh

            - name: Build UI dependencies
              run: nix develop -c ./scripts/ui/build-deps.sh

            - name: Bump version & prep for APK build
              id: versioning
              run: nix develop -c ./scripts/ui/bump-version-native.sh

            - name: Build APK
              env:
                  APK_PATH: ${{ steps.versioning.outputs.APK_PATH }}
                  # Consider: should we even have separate steps above for this?
                  BUILD_BRIDGE: 0
                  BUILD_UI_DEPS: 0
              run: nix develop -c ./scripts/ui/build-production-apk.sh

            - name: Create draft GitHub release with APK
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.versioning.outputs.APK_VERSION }}
                  name: 'v${{ steps.versioning.outputs.APK_VERSION }}'
                  body: 'This release was generated by CI with the latest APK for an upcoming release. Built from commit: ${{ steps.versioning.outputs.COMMIT_TO_DEPLOY }}'
                  draft: true
                  files: ${{ steps.versioning.outputs.APK_PATH }}

    call-deployment-workflow:
        name: Trigger deployment to Google Play for Internal Testing
        needs: release-android
        uses: ./.github/workflows/deploy-to-gp-internal-testing.yml
        secrets: inherit
        with:
            commit-to-deploy: ${{ needs.release-android.outputs.commit-to-deploy }}
        if: >-
            startsWith(github.ref, 'refs/heads/release/')

    call-deployment-workflow-testflight:
        name: Trigger deployment to TestFlight
        needs: release-android
        uses: ./.github/workflows/deploy-to-testflight.yml
        secrets: inherit
        with:
            commit-to-deploy: ${{ needs.release-android.outputs.commit-to-deploy }}
        if: >-
            startsWith(github.ref, 'refs/heads/release/')
