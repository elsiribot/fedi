name: Deploy to TestFlight
on:
    workflow_dispatch:

jobs:
    release-ios:
        name: Build iOS app and upload to TestFlight
        runs-on: [self-hosted, macos]
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            - name: Build bridge
              run: nix develop --command env CARGO_PROFILE=release ./scripts/bridge/build-bridge-ios.sh

            - name: Build UI dependencies
              run: nix develop --command ./scripts/ui/build-deps.sh

            - name: Install iOS dependencies (Cocoapods)
              run: nix develop --command ./scripts/ui/install-ios-deps.sh

            - name: Generate JSON credentials file
              run: |
                  mkdir tmp
                  echo ${{ secrets.ASC_API_KEY_JSON_CREDENTIALS_ENCODED }} >> ./tmp/asc-api-key-credentials.txt
                  base64 --decode ./tmp/asc-api-key-credentials.txt >> ./ios/decoded-asc-api-key-credentials.json
                  rm -rf ./tmp

            - name: Execute fastlane beta lane for CI within Nix
              env:
                  MATCH_PASSWORD: 'fedimint'
              run: |
                  nix develop .#xcode --command ./scripts/ui/deploy-to-testflight.sh
