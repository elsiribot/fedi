name: Check PRs for potential conflicts
# This workflow runs every time a Pull Request is opened, updated, or reopened
on: 
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: potential-conflicts-checker
    runs-on: ubuntu-latest
    steps:
      - uses: outsideris/potential-conflicts-checker-action@0.1.0
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
