name: Upload Fedi Bravo APK to GitHub
on:
    workflow_dispatch:

jobs:
    release-android-bravo:
        name: Build Android APK and upload to GitHub draft release
        runs-on: [self-hosted, linux]
        outputs:
            commit-to-deploy: ${{ steps.versioning.outputs.COMMIT_TO_DEPLOY }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
              with:
                  submodules: true

            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Build bridge
              run: nix develop --command env CARGO_PROFILE=release ./scripts/bridge/build-bridge-android.sh

            - name: Build UI dependencies
              run: nix develop --command ./scripts/ui/build-deps.sh

            - name: Bump version & prep for APK build
              id: versioning
              env:
                  FLAVOR: 'bravo'
              run: nix develop --command ./scripts/ui/bump-version-native.sh

            - name: Build APK
              env:
                  APK_PATH: ${{ steps.versioning.outputs.APK_PATH }}
              run: nix develop --command ./scripts/ui/build-bravo-apk.sh

            - name: Create draft GitHub release with APK
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.versioning.outputs.APK_VERSION }}-bravo
                  name: 'Fedi Bravo v${{ steps.versioning.outputs.APK_VERSION }}'
                  body: 'This release was generated by CI with the latest APK for an upcoming release. Built from commit: ${{ steps.versioning.outputs.COMMIT_TO_DEPLOY }}'
                  draft: true
                  files: ${{ steps.versioning.outputs.APK_PATH }}

