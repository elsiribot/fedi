name: Deploy to Google Play - Internal Testing
on:
    workflow_dispatch:
    workflow_call:
        inputs:
            commit-to-deploy:
                required: false
                type: string

defaults:
    run:
        working-directory: ui/native

jobs:
    release-android:
        name: Build Android AAB & Upload to Google Play Dev Console
        runs-on: buildjet-8vcpu-ubuntu-2204
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
              with:
                  submodules: true
                  ref: ${{ inputs.commit-to-deploy }}

            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Setup JDK
              uses: actions/setup-java@v3
              with:
                  distribution: 'zulu'
                  java-version: 11
                  cache: 'gradle'

            - name: Setup Node
              uses: actions/setup-node@v1
              with:
                  node-version: '16.18.X'

            - name: Build bridge
              run: |
                  yarn build-bridge-android

            - name: Install Node dependencies
              run: yarn install

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '2.7.5'

            - name: Generate JSON credentials file
              run: |
                  mkdir tmp
                  echo ${{ secrets.PLAY_STORE_JSON_CREDENTIALS_ENCODED }} >> ./tmp/service-account-credentials.txt
                  base64 --decode ./tmp/service-account-credentials.txt >> ./android/decoded-service-account-credentials.json
                  rm -rf ./tmp

            - name: Install Fastlane
              run: cd android && bundle install && cd ..

            - name: Execute Fastlane command
              run: cd android && bundle exec fastlane internal && cd ..
