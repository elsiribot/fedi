name: Publish Android APK to GitHub
on:
    workflow_dispatch:
    push:
        branches:
            - 'release/**.**'
            - '!release/**.**.**'
jobs:
    release-android:
        name: Build Android APK and publish in GitHub draft release
        runs-on: buildjet-4vcpu-ubuntu-2204
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
              with:
                  submodules: true

            - name: Cache
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ./bridge/target
                  key: ${{ runner.os }}-${{ hashFiles('**/Cargo.toml','**/Cargo.lock') }}

            - name: Setup JDK
              uses: actions/setup-java@v3
              with:
                  distribution: 'zulu'
                  java-version: 11
                  cache: 'gradle'

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: nightly
                  override: true
                  components: rustfmt, clippy

            - name: Add Rust targets for Android
              run: |
                  rustup target add x86_64-linux-android
                  rustup target add aarch64-linux-android
                  rustup target add armv7-linux-androideabi

            - name: Setup Android NDK
              id: setup-ndk
              uses: nttld/setup-ndk@v1
              with:
                  ndk-version: r25c
                  local-cache: true

            - name: Save ANDROID_NDK_ROOT to environment
              run: |
                  echo $'ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}' >> $GITHUB_ENV

            - name: Configure environment for all targets
              run: |
                  echo AR=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar >> $GITHUB_ENV
                  echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
                  cp $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-clang
                  cp $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++ $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-clang++

            - name: Build bridge
              run: |
                  npm run build-bridge-android

            - name: Setup Node
              uses: actions/setup-node@v1
              with:
                  node-version: '16.18.X'

            - name: Install Node dependencies
              run: npm ci --cache .npm

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '2.7.5'

            - name: Install Fastlane
              run: cd android && bundle install && cd ..

            - name: Bump version & prep for APK build
              id: versioning
              run: |
                  git config --global user.email "dev@fedibtc.com"
                  git config --global user.name "Fedi Dev CI"
                  RELEASE_BRANCH_VERSION="${GITHUB_REF##*/}"
                  CURRENT_VERSION="$(npm pkg get version | sed 's/"//g')"
                  CURRENT_MINOR_VERSION="$(cut -d '.' -f 1,2 <<< "$CURRENT_VERSION")"
                  if [[ "$CURRENT_MINOR_VERSION" != "$RELEASE_BRANCH_VERSION" ]] && [[ "$RELEASE_BRANCH_VERSION" == *"."* ]];
                  then
                      echo 'Bumping minor version'
                      npm version --allow-same-version --force $RELEASE_BRANCH_VERSION.0
                  else
                      echo 'Bumping patch version'
                      npm version --allow-same-version --force patch
                  fi
                  npx react-native-version --amend
                  git push
                  NEW_VERSION="$(npm pkg get version | sed 's/"//g')"
                  echo "NEW_VERSION=$(npm pkg get version | sed 's/"//g')" >> $GITHUB_OUTPUT
                  echo "APK_PATH=./android/app/build/outputs/apk/production/release/app-production-release-${NEW_VERSION}.apk" >> $GITHUB_OUTPUT

            - name: Build APK
              run: |
                  cd android && bundle exec fastlane build_production_apk && cd ..

            - name: Rename APK with version
              run: |
                  RELEASE_PATH=./android/app/build/outputs/apk/production/release
                  SOURCE=$RELEASE_PATH/app-production-release.apk
                  DESTINATION=$RELEASE_PATH/app-production-release-${{ steps.versioning.outputs.NEW_VERSION }}.apk
                  mv $SOURCE $DESTINATION

            - name: Create draft GitHub release with APK
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.versioning.outputs.NEW_VERSION }}
                  name: 'v${{ steps.versioning.outputs.NEW_VERSION }}'
                  body: 'This release was generated by CI with the latest APK for an upcoming release'
                  draft: true
                  files: ${{ steps.versioning.outputs.APK_PATH }}
