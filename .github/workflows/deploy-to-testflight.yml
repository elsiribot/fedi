name: Deploy to TestFlight
on:
    workflow_dispatch:
    workflow_call:
        inputs:
            commit-to-deploy:
                required: false
                type: string

jobs:
    release-ios:
        name: Build iOS app and upload to TestFlight
        runs-on: [self-hosted, macos, arm64]
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3
              with:
                  ref: ${{ inputs.commit-to-deploy }}

            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            - name: Build bridge
              run: nix develop --command env BUILD_ALL_BRIDGE_TARGETS=1 CARGO_PROFILE=release scripts/ci/run-in-fs-dir-cache.sh build-bridge-ios ./scripts/bridge/build-bridge-ios.sh

            - name: Build UI dependencies
              run: nix develop --command ./scripts/ui/build-deps.sh

            - name: Install iOS dependencies (Cocoapods)
              run: nix develop --command ./scripts/ui/install-ios-deps.sh

            - name: Generate JSON credentials file
              env:
                  ASC_API_KEY_JSON_CREDENTIALS_ENCODED: ${{ secrets.ASC_API_KEY_JSON_CREDENTIALS_ENCODED }}
              run: nix develop --command ./scripts/ci/make-testflight-creds.sh

            - name: Execute fastlane beta lane for CI
              env:
                  # TODO: for prod, regenerate certificates and convert these to secrets
                  MATCH_KEYCHAIN_NAME: '/Users/runner/Library/Keychains/ci.keychain'
                  MATCH_KEYCHAIN_PASSWORD: 'fedibtc'
                  MATCH_PASSWORD: 'fedibtc'
                  # Consider: should we even have separate steps above for this?
                  BUILD_BRIDGE: 0
                  BUILD_UI_DEPS: 0
                  REINSTALL_PODS: 0
              run: |
                  ./scripts/ui/deploy-to-testflight.sh
