name: Test caller workflow
on:
    workflow_dispatch:

jobs:
    build-publish-android-apk:
        name: Test caller workflow
        runs-on: buildjet-4vcpu-ubuntu-2204
        outputs:
            commit-to-deploy: ${{ steps.versioning.outputs.commit-to-deploy }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
              with:
                  submodules: true

            - name: Install Node dependencies
              run: npm ci --cache .npm

            - name: Test
              id: versioning
              run: |
                  git config --global user.email "dev@fedibtc.com"
                  git config --global user.name "Fedi Dev CI"
                  RELEASE_BRANCH_VERSION="${GITHUB_REF##*/}"
                  CURRENT_VERSION="$(npm pkg get version | sed 's/"//g')"
                  CURRENT_MINOR_VERSION="$(cut -d '.' -f 1,2 <<< "$CURRENT_VERSION")"
                  git log -1
                  echo "test"
                  echo "$GITHUB_REF"
                  echo "$RELEASE_BRANCH_VERSION"
                  echo "$CURRENT_VERSION"
                  echo "$CURRENT_MINOR_VERSION"
                  npm version --allow-same-version --force patch
                  npx react-native-version --amend --target android
                  git push
                  git log -1
                  git rev-parse HEAD
                  echo "commit-to-deploy=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                  NEW_VERSION="$(npm pkg get version | sed 's/"//g')"
                  echo "$NEW_VERSION"

    call-deployment-workflow:
        name: Trigger deployment to Google Play for Internal Testing
        needs: build-publish-android-apk
        uses: ./.github/workflows/test-callable-workflow.yml
        with:
            commit-to-deploy: ${{ needs.build-publish-android-apk.outputs.commit-to-deploy }}
