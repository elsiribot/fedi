name: Run test suites
on:
    workflow_dispatch:
    pull_request:
        branches:
            - 'master'
            - 'release/**'
        paths:
            - 'ui/**'

defaults:
  run:
    working-directory: ui

jobs:
    run:
        name: Check code & run tests
        runs-on: buildjet-2vcpu-ubuntu-2204
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: '16.18.X'
                  cache: 'yarn'
            - name: Install dependencies
              run: yarn install
            - name: Check for Prettier, ESLint, + Typescript errors
              run: yarn run lint
            - name: Run tests with Jest
              run: yarn run test
