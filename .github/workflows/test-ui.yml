name: Run test suites for UI code
on:
    workflow_dispatch:
    pull_request:
        branches:
            - 'master'
            - 'release/**'
        paths:
            - 'ui/**'

defaults:
    run:
        working-directory: ui

jobs:
    run:
        name: Check code & run tests
        runs-on: buildjet-2vcpu-ubuntu-2204
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: '18.14.X'
                  cache: 'yarn'
                  cache-dependency-path: ui/yarn.lock
            - name: Install dependencies
              run: yarn install
            - name: Check for Prettier, ESLint, + Typescript errors
              run: yarn lint
            - name: Run tests with Jest
              run: yarn test
            # TODO: These steps depend on the bridge so to avoid waiting too
            # long for this CI check we skip them for now
