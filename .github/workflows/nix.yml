name: 'Nix'

# Controls when the workflow will run
on:
    # Triggers the workflow on push or pull request events but only for the "main" branch
    push:
        branches: ['main', 'master', 'devel']
        paths-ignore:
            - 'ui/**'
    pull_request: 
        paths-ignore:
            - 'ui/**'

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    lint:
        name: 'Lint'
        runs-on: [self-hosted, linux]
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            # run the same check that git `pre-commit` hook would, just in case
            - name: Commit check
              run: nix develop --ignore-environment .#lint --command ./misc/git-hooks/pre-commit

    build-linux:
        name: 'Build - linux'
        runs-on: [self-hosted, linux]
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Build fedi-fedimint-pkgs
              run: nix build -L .#fedi-fedimint-pkgs

            - name: Build fedi-wasm
              run: nix build -L .#fedi-wasm

            - name: Build gateway-pkgs
              run: nix build -L .#gateway-pkgs

            - name: Build fedi-monitoring
              run: nix build -L .#fedi-monitoring

            - name: Build devops-cli
              run: nix build -L .#devops-cli

            - name: Test bridge
              # TODO: turn this into a nix derivation
              run: nix build -L .#bridgeTests

    build-android:
        name: 'Build - android'
        runs-on: [self-hosted, linux]
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Build Android bridge artifacts
              run: nix develop --ignore-environment --command env HOME="$HOME" CARGO_PROFILE=ci scripts/ci/run-in-fs-dir-cache.sh build-bridge-android ./scripts/bridge/build-bridge-android.sh

    build-ios:
        name: 'Build - macos'
        runs-on: [self-hosted, macos]
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            - name: Build iOS bridge artifacts
              # note: can't use --ignore-environment as it uses globally installed xcode
              run: nix develop .#xcode --command env HOME="$HOME" CARGO_PROFILE=ci scripts/ci/run-in-fs-dir-cache.sh build-bridge-ios ./scripts/bridge/build-bridge-ios.sh

    shell:
        strategy:
            matrix:
                host:
                    - linux
                    - macos
                include:
                    - on: linux
                      runs-on: [self-hosted, linux]
                      build-in-pr: true
                      timeout: 30
                      system: x86_64-linux
                    - host: macos
                      runs-on: [self-hosted, macos]
                      os: macOS
                      build-in-pr: true
                      timeout: 45
                      system: x86_64-darwin

        name: 'Dev shells - ${{ matrix.host }}'
        runs-on: ${{ matrix.runs-on }}
        timeout-minutes: ${{ matrix.timeout }}

        steps:
            - uses: actions/checkout@v3
              if: github.ref == 'refs/heads/master' || matrix.build-in-pr

            - uses: cachix/install-nix-action@v20
              if: github.ref == 'refs/heads/master' || matrix.build-in-pr
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              if: github.ref == 'refs/heads/master' || matrix.build-in-pr
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            - name: Dev shell
              if: (github.ref == 'refs/heads/master' || matrix.build-in-pr)
              run: nix build -L .#devShells.${{ matrix.system }}.default
