name: 'Nix'

# Controls when the workflow will run
on:
    # Triggers the workflow on push or pull request events but only for the "main" branch
    push:
        branches: ['main', 'master', 'devel']
    pull_request: {}

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    lint:
        name: 'Lint'
        runs-on: [self-hosted, linux]
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            # run the same check that git `pre-commit` hook would, just in case
            - name: Commit check
              run: nix develop --ignore-environment .#lint --command ./misc/git-hooks/pre-commit

    # DELETME: no-op renamed build step that is blocking PRs
    # should just pass and Build - linux should replace it
    build:
        name: 'Build'
        runs-on: [self-hosted, linux]
        steps:
            - name: Trick CI
              run: echo 'no-op'

    build-linux:
        name: 'Build - linux'
        runs-on: [self-hosted, linux]
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Build fedi-fedimint-pkgs
              run: nix build -L .#fedi-fedimint-pkgs

            - name: Build fedi-wasm
              run: nix build -L .#fedi-wasm

            - name: Build gateway-pkgs
              run: nix build -L .#gateway-pkgs

            - name: Build dbtool-pkgs
              run: nix build -L .#dbtool-pkgs

            - name: Build fedi-monitoring
              run: nix build -L .#fedi-monitoring

            - name: Build Android bridge artifacts
              run: nix develop .#cross --command just build-bridge-android

            - name: Test bridge
              run: nix build -L .#testBridge

    build-ios:
        name: 'Build - macos'
        runs-on: [self-hosted, macos]
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v3
            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05
            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            - name: Build iOS bridge artifacts
              run: nix develop .#cross --command just build-bridge-ios

    shell:
        strategy:
            matrix:
                host:
                    - linux
                    - macos
                include:
                    - on: linux
                      runs-on: [self-hosted, linux]
                      build-in-pr: true
                      timeout: 30
                      system: x86_64-linux
                    - host: macos
                      runs-on: [self-hosted, macos]
                      os: macOS
                      build-in-pr: true
                      timeout: 45
                      system: x86_64-darwin

        name: 'Dev shells - ${{ matrix.host }}'
        runs-on: ${{ matrix.runs-on }}
        timeout-minutes: ${{ matrix.timeout }}

        steps:
            - uses: actions/checkout@v3
              if: github.ref == 'refs/heads/master' || matrix.build-in-pr

            - uses: cachix/install-nix-action@v20
              if: github.ref == 'refs/heads/master' || matrix.build-in-pr
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              if: github.ref == 'refs/heads/master' || matrix.build-in-pr
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
              continue-on-error: true

            - name: Dev shell
              if: (github.ref == 'refs/heads/master' || matrix.build-in-pr)
              run: nix run nixpkgs#nix-eval-jobs -- --gc-roots-dir .gcroots --flake .#devShells.${{ matrix.system }}.default

            - name: Cross shell
              if: (github.ref == 'refs/heads/master' || matrix.build-in-pr)
              run: |
                  # WORKAROUND: broken on MacOS for some reason, so use standard `nix build`
                  if [ "${{ matrix.system }}" == "x86_64-darwin" ]; then
                    nix build -L .#devShells.${{ matrix.system }}.cross
                  else
                    nix run nixpkgs#nix-eval-jobs -- --gc-roots-dir .gcroots --flake .#devShells.${{ matrix.system }}.cross
                  fi
