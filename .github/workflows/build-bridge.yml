name: Build bridge
on:
    workflow_dispatch:
    # runs on release/X.Y branches but not release/X.Y.Z branches
    # push:
    #     branches:
    #         - 'release/**.**'
    #         - '!release/**.**.**'

jobs:
    release-android:
        name: Build bridge binaries for both iOS and Android
        runs-on: buildjet-16vcpu-ubuntu-2204
        steps:
            - name: Checkout repo
              uses: actions/checkout@v2
              with:
                  submodules: true

            - uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - uses: cachix/cachix-action@v12
              with:
                  name: fedibtc
                  authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

            - name: Build bridge
              run: |
                  nix develop --command just build-bridge

            # TODO: Upload bridge artifacts somewhere that other workflows can use to download
