name: Bump patch version
on:
    workflow_dispatch:
    push:
        branches:
            - 'release/**.**'
            - '!release/**.**.**'
        paths:
            - 'bridge/**'
            - 'ui/native/**'
            - 'ui/common/**'
            - '!ui/native/ios/**' # Don't run for changes in /ios folder
jobs:
    bump-version:
        permissions:
            contents: write
            pull-requests: write
        name: Update version to match release branch
        runs-on: [self-hosted, linux]
        if: contains(github.ref, 'release/')
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install Nix
              uses: cachix/install-nix-action@v20
              with:
                  nix_path: nixpkgs=channel:nixos-22.05

            - name: Bump version
              id: versioning
              run: nix develop -c ./scripts/ui/bump-version-native.sh

            - name: Open Versioning PR
              uses: peter-evans/create-pull-request@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  body: 'This PR includes a version bump commit from a release branch for v${{steps.versioning.outputs.NEW_VERSION}}'
                  title: 'bump version: v${{ steps.versioning.outputs.NEW_VERSION }}'
                  branch: ${{ steps.versioning.outputs.BRANCH_NAME }}
                  base: 'master'
